<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Redirecting…</title>
    <meta name="robots" content="noindex">
    <script>
      // SPA fallback for GitHub Pages: load index.html and let the client router handle the path
      (function () {
        var wantedPath = location.pathname + location.search + location.hash;
        // Try to fetch index.html from the same origin
        fetch('/index.html')
          .then(function (r) {
            if (!r.ok) throw new Error('index fetch failed');
            return r.text();
          })
          .then(function (html) {
            // Replace the current document with index.html content
            document.open();
            document.write(html);
            document.close();
            // Restore original path so the client router can read it
            if (window.history && window.history.replaceState) {
              window.history.replaceState({}, '', wantedPath);
            }
          })
          .catch(function () {
            // If fetch fails (e.g., GitHub Pages does not expose index.html), fallback to root
            location.replace('/');
          });
      })();
    </script>
  </head>
  <body>
    <p>Redirecting… If you are not redirected automatically, <a href="/">click here</a>.</p>
  </body>
</html>
